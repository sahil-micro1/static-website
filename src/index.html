  <script>
/**
 * DataGrail consent — mobile “Read more” for explanation body text.
 *
 * Paste into Webflow Site Settings > Custom Code > Footer (no <script> tags
 * if using the Scripts API). Works with open shadow roots on .dg-consent-banner.
 *
 * Pair with dg-consent-custom.css (.is-clamped / .dg-read-more).
 * Clamps with max-height (top-down), not -webkit-line-clamp.
 */
(() => {
  const HOST_SEL = ".dg-consent-banner";
  const BODY_SEL = ".dg-main-content-explanation.dg-text-body";
  const MQ = "(max-width: 600px)";
  const LINES = 2;

  function ensureTextWrap(explanation) {
    let text = explanation.querySelector(":scope > .dg-explanation-text");
    if (text) return text;

    const onlyChild = explanation.firstElementChild;
    if (
      onlyChild &&
      onlyChild.tagName === "DIV" &&
      explanation.children.length === 1
    ) {
      onlyChild.classList.add("dg-explanation-text");
      return onlyChild;
    }

    text = document.createElement("div");
    text.className = "dg-explanation-text";
    while (explanation.firstChild) {
      text.appendChild(explanation.firstChild);
    }
    explanation.appendChild(text);
    return text;
  }

  function lineHeightPx(el) {
    const cs = getComputedStyle(el);
    const lh = cs.lineHeight;
    if (lh === "normal") {
      return parseFloat(cs.fontSize) * 1.2;
    }
    const parsed = parseFloat(lh);
    if (lh.endsWith("px")) return parsed;
    return parsed * parseFloat(cs.fontSize);
  }

  function clearClampStyles(text) {
    text.style.maxHeight = "";
    text.style.overflow = "";
  }

  function enhanceExplanation(explanation) {
    if (explanation.querySelector(":scope > .dg-read-more")) return;

    const text = ensureTextWrap(explanation);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "dg-read-more";
    btn.textContent = "Read more";
    explanation.appendChild(btn);

    const applyClamp = () => {
      if (btn.hidden) return;

      if (!window.matchMedia(MQ).matches) {
        explanation.classList.remove("is-clamped");
        clearClampStyles(text);
        return;
      }

      // Measure full height with clamp off.
      explanation.classList.remove("is-clamped");
      clearClampStyles(text);
      const fullHeight = text.scrollHeight;
      const maxHeight = Math.round(lineHeightPx(text) * LINES);

      if (fullHeight <= maxHeight + 1) {
        return;
      }

      explanation.classList.add("is-clamped");
      text.style.maxHeight = `${maxHeight}px`;
      text.style.overflow = "hidden";
      text.scrollTop = 0;
    };

    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      explanation.classList.remove("is-clamped");
      clearClampStyles(text);
      btn.hidden = true;
    });

    applyClamp();
    window.addEventListener("resize", applyClamp);
  }

  function enhanceHost(host) {
    const root = host.shadowRoot;
    if (!root) return;
    root.querySelectorAll(BODY_SEL).forEach(enhanceExplanation);
  }

  function scan() {
    document.querySelectorAll(HOST_SEL).forEach(enhanceHost);
  }

  const obs = new MutationObserver(scan);
  obs.observe(document.documentElement, {
    childList: true,
    subtree: true,
    attributes: true,
    attributeFilter: ["class", "style"],
  });

  scan();
})();
  </script>
</body>
