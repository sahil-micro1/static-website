<script>
/* ---------- funnel by task ---------- */
reg("das-funnelChart",(W,compact)=>{
  const T=TASKS.slice(1);
  const data=T.map(([k,lab])=>{let n=0,c=[0,0,0,0,0,0];LLM.forEach(m=>{const t=m.by_task[k];n+=t.n;t.stages.forEach((v,i)=>c[i]+=v);});return {k,lab,n,reach:[1,2,3,4,5].map(i=>c.slice(i).reduce((a,b)=>a+b,0)/n)};});
  if(compact){
    const gh=20+5*18+20, H=data.length*gh, pad=4, lw=92, pw=W-pad-lw-44;
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress funnel by task"><title>Progress funnel by task</title>`;
    data.forEach((d,ti)=>{const y0=ti*gh;
      s+=`<text x="${pad}" y="${y0+14}" font-size="14" fill="${C.text}">${d.lab} <tspan fill="${C.faint}" font-size="12">${d.n} trials</tspan></text>`;
      d.reach.forEach((v,i)=>{const y=y0+24+i*18;
        s+=`<text x="${pad}" y="${y+10}" font-size="12" fill="${C.soft}">${ST_LAB[i+1]}</text><rect x="${pad+lw}" y="${y}" width="${pw}" height="12" fill="${C.track}"/>`;
        s+=bar(pad+lw,y,Math.max(pw*v,2),12,ST_COL[i+1],`${d.lab}|${ST_LAB[i+1]} or later: ${Math.round(v*100)}% of ${d.n} trials`,ti*5+i,'');
        s+=`<text x="${W-pad}" y="${y+10}" font-size="12" fill="${C.soft}" text-anchor="end">${Math.round(v*100)}%</text>`;});
    });
    return withDefs(s+`</svg>`);
  }
  const H=340,l=48,r=8,top=24,b=44,pw=W-l-r,ph=H-top-b,gw=pw/T.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress funnel by task"><title>Progress funnel by task</title>`;
  [0,.2,.4,.6,.8,1].forEach(t=>{const y=top+ph*(1-t);s+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="#252525" stroke-dasharray="3 3"/><text x="${l-8}" y="${y+4}" font-size="11" fill="${C.soft}" text-anchor="end">${Math.round(t*100)}%</text>`;});
  s+=`<line x1="${l}" x2="${l}" y1="${top}" y2="${top+ph}" stroke="${C.line}"/><line x1="${l}" x2="${W-r}" y1="${top+ph}" y2="${top+ph}" stroke="${C.line}"/>`;
  data.forEach((d,ti)=>{
    const bw=Math.min(32,(gw-40)/5-6), gap=6, gx=l+ti*gw+(gw-(5*bw+4*gap))/2;
    d.reach.forEach((v,i)=>{const x=gx+i*(bw+gap),h=ph*v;
      s+=bar(x,top+ph-h,bw,Math.max(h,1),ST_COL[i+1],`${d.lab}|${ST_LAB[i+1]} or later: ${Math.round(v*100)}% of ${d.n} trials`,ti*5+i,'',"das-bar das-up");
      s+=`<text class="das-fade" x="${x+bw/2}" y="${top+ph-h-6}" font-size="11" fill="${C.text}" text-anchor="middle">${Math.round(v*100)}%</text>`;});
    s+=`<text x="${l+ti*gw+gw/2}" y="${H-20}" font-size="12" fill="${C.soft}" text-anchor="middle">${d.lab}</text><text x="${l+ti*gw+gw/2}" y="${H-5}" font-size="11" fill="${C.faint}" text-anchor="middle">${d.n} trials</text>`;
  });
  return withDefs(s+`</svg>`);
});

/* ---------- claims & phantom carries ---------- */
reg("das-claimChart",(W,compact)=>{
  const items=[...LLM].sort((a,b)=>a.claims.claim/a.claims.n-b.claims.claim/b.claims.n);
  return rows({title:"False completion claims by model",items,W,compact,max:.7,ticks:compact?[0,.35,.7]:[0,.1,.2,.3,.4,.5,.6,.7],tickFmt:v=>Math.round(v*100)+"%",rightHead:"Trials with a false claim",
    segs:m=>{const c=m.claims;return [{v:c.none/c.n,c:PAL.blue,t:`no contact ${c.none}`},{v:(c.nograsp-c.none)/c.n,c:PAL.white,t:`reached, never grasped ${c.nograsp-c.none}`},{v:(c.claim-c.nograsp)/c.n,c:PAL2.orange,t:`grasped, unfinished ${c.claim-c.nograsp}`}];},
    right:m=>`${m.claims.claim} of ${m.claims.n}`});
});
reg("das-phantomChart",(W,compact)=>{
  const ph=[...LLM].sort((a,b)=>a.cart.phantom/a.cart.traced-b.cart.phantom/b.cart.traced||a.name.localeCompare(b.name));
  return rows({title:"Phantom carries by model",items:ph,W,compact,max:1,ticks:[0,.25,.5,.75,1],tickFmt:v=>Math.round(v*100)+"%",rightHead:"Phantom carries",
    segs:m=>{const c=m.cart,ok=c.traced-c.phantom;return [{v:ok/c.traced,c:"#9FA3FC",t:`${ok} of ${c.traced} trials without a phantom carry`},{v:c.phantom/c.traced,c:"#E07A6B",t:`${c.phantom} of ${c.traced} trials with a phantom carry`}];},
    right:m=>`${m.cart.phantom} of ${m.cart.traced}`});
});

/* ---------- cartridge ---------- */
reg("das-cartChart",(W,compact)=>{
  const items=[...LLM].sort((a,b)=>(b.cart.swapped*3+b.cart.lifted-b.cart.floor*2)-(a.cart.swapped*3+a.cart.lifted-a.cart.floor*2)).concat(M.filter(m=>m.vla));
  return rows({title:"Drug cartridge outcomes by model",items,W,compact,max:20,ticks:[0,5,10,15,20],rightW:24,
    segs:m=>{const c=m.cart;const other=c.lifted-c.swapped-c.floor-c.trolley;return [{v:c.swapped,c:PAL.green,t:`swapped ${c.swapped}`},{v:c.floor,c:PAL2.orange,t:`on the floor ${c.floor}`},{v:c.trolley,c:PAL.white,t:`dropped on trolley ${c.trolley}`},{v:other,c:PAL.blue,t:`lifted, not finished ${other}`}];},
    right:()=>""});
});

/* ---------- perception dumbbell ---------- */
reg("das-percChart",(W,compact)=>{
  const items=[...LLM].sort((a,b)=>a.perc.best-b.perc.best);
  const rowH=compact?84:40,l=compact?12:210,r=compact?12:40,top=28,H=top+items.length*rowH+8,pw=compact?W-24:W-l-r-16,max=60,X=v=>l+pw*Math.min(v,max)/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Target position error"><title>Target position error by model</title>`;
  (compact?[0,20,40,60]:[0,10,20,30,40,50,60]).forEach(t=>{s+=`<line x1="${X(t)}" x2="${X(t)}" y1="${top-6}" y2="${H-6}" stroke="${C.line}" stroke-dasharray="3 4"/><text x="${X(t)}" y="${top-12}" font-size="12" fill="${C.faint}" text-anchor="${compact&&t===60?"end":compact&&t===0?"start":"middle"}">${t} cm</text>`;});
  items.forEach((m,i)=>{const y0=top+i*rowH+rowH/2,p=m.perc,y=compact?y0+8:y0;
    s+=`<g class="das-row-hit"><rect class="das-row-bg" x="0" y="${y0-rowH/2+2}" width="${W}" height="${rowH-4}" rx="4"/>`;
    if(compact){s+=label(m,4,y0-24,20);}
    else s+=label(m,8,y);
    s+=bar(X(p.best),y-2,X(p.first)-X(p.best),4,"var(--das-white-20)",null,i,'');
    s+=`<circle class="das-pop" data-das-delay="${i*35}" cx="${X(p.first)}" cy="${y}" r="7" fill="${C.card}" stroke="${C.soft}" stroke-width="2" data-das-tip="${esc(m.name)}|First guess: ${p.first} cm from the target"/>`;
    s+=`<circle class="das-pop" data-das-delay="${i*35}" cx="${X(p.best)}" cy="${y}" r="7" fill="${C.accent}" data-das-tip="${esc(m.name)}|Best guess before touching it: ${p.best} cm from the target"/>`;
    if(compact){const cx=v=>Math.min(Math.max(X(v),l+14),W-r-14);
      s+=`<text class="das-fade" x="${cx(p.first)}" y="${y+22}" font-size="12" fill="${C.faint}" text-anchor="middle">${p.first}</text><text class="das-fade" x="${cx(p.best)}" y="${y+22}" font-size="12" fill="${C.text}" text-anchor="middle">${p.best}</text>`;}
    else s+=`<text class="das-fade" x="${X(p.first)+12}" y="${y+4}" font-size="12" fill="${C.faint}">${p.first}</text><text class="das-fade" x="${X(p.best)-12}" y="${y+4}" font-size="12" fill="${C.text}" text-anchor="end">${p.best}</text>`;
    s+=`</g>`;});
  return withDefs(s+`</svg>`);
});

/* ---------- closest approach, all models ---------- */
reg("das-reachChart",(W,compact)=>{
  const R={"claude-fable-5.1":[4.7,44,80],"claude-opus-5.5":[7.8,20,53],"claude-sonnet-5.5":[7.4,23,80],"gemini-3.1-pro":[11.7,11,80],"gemini-3.8-flash":[5.4,37,80],"gemini-4-argon":[6.3,33,80],"muse-wonder":[11.0,11,80],"gpt-6-astra":[3.9,52,80],"gpt-6.1-sol":[4.0,46,80],"grok-4.7":[13.1,13,80],"gr00t_zs":[17.8,6,80],"pi05_zs":[22.8,0,80]};
  const items=M.filter(m=>R[m.id]).sort((a,b)=>R[a.id][0]-R[b.id][0]);
  return rows({title:"Median closest approach to the target",items,W,compact,max:25,ticks:[0,5,10,15,20,25],tickFmt:v=>v+" cm",rightHead:"Median",
    segs:m=>[{v:R[m.id][0],c:m.vla?C.accentSoft:C.accent,t:`median ${R[m.id][0]} cm`}],
    right:m=>`${R[m.id][0].toFixed(1)} cm`});
});

/* ---------- recovery ---------- */
reg("das-recChart",(W,compact)=>{
  const items=[...LLM].sort((a,b)=>b.recovery.rec/b.recovery.elig-a.recovery.rec/a.recovery.elig);
  return rows({title:"Recovery after an empty grasp",items,W,compact,max:1,ticks:[0,.25,.5,.75,1],tickFmt:v=>Math.round(v*100)+"%",rightHead:"Recovered",
    segs:m=>{const r=m.recovery,v=r.rec/r.elig;return [{v,c:v>=.6?PAL.green:v<.1?PAL.gold:PAL.blue,t:`recovered ${r.rec} of ${r.elig}`}];},
    right:m=>`${pct(m.recovery.rec,m.recovery.elig)}%`});
});

/* ---------- bimanual grouped ---------- */
const BI={"claude-fable-5.1": {"done": 0, "early": 2, "missed": 1, "slip": 2, "noatt": 0, "wrong": 2, "never": 13}, "claude-opus-5.5": {"done": 0, "early": 0, "missed": 1, "slip": 1, "noatt": 1, "wrong": 0, "never": 17}, "claude-sonnet-5.5": {"done": 0, "early": 0, "missed": 0, "slip": 1, "noatt": 2, "wrong": 2, "never": 15}, "gemini-3.1-pro": {"done": 0, "early": 0, "missed": 0, "slip": 1, "noatt": 0, "wrong": 0, "never": 19}, "gemini-3.8-flash": {"done": 0, "early": 1, "missed": 7, "slip": 7, "noatt": 1, "wrong": 2, "never": 2}, "gemini-4-argon": {"done": 0, "early": 2, "missed": 3, "slip": 4, "noatt": 0, "wrong": 3, "never": 8}, "muse-wonder": {"done": 0, "early": 0, "missed": 0, "slip": 1, "noatt": 1, "wrong": 0, "never": 18}, "gpt-6-astra": {"done": 0, "early": 5, "missed": 2, "slip": 2, "noatt": 0, "wrong": 1, "never": 10}, "gpt-6.1-sol": {"done": 0, "early": 1, "missed": 1, "slip": 2, "noatt": 0, "wrong": 2, "never": 14}, "grok-4.7": {"done": 0, "early": 0, "missed": 0, "slip": 1, "noatt": 0, "wrong": 1, "never": 18}, "claude-fable-5.2": {"done": 4, "early": 3, "missed": 0, "slip": 4, "noatt": 0, "wrong": 0, "never": 9}};
reg("das-biChart",(W,compact)=>{
  const K=[["done","#8FDCA0","handed over"],["early",ST_COL[5],"left arm let go too early"],["missed",ST_COL[4],"right gripper closed on air"],["slip",ST_COL[3],"bottle slipped from the left gripper"],["noatt",ST_COL[2],"lifted, no handoff tried"],["wrong",ST_COL[1],"picked up with the wrong arm"]];
  const sc=m=>{const b=BI[m.id];return b.done*1000+(b.early+b.missed)*20+b.slip+b.noatt;};
  const items=[...LLM].filter(m=>BI[m.id]).sort((a,b)=>sc(b)-sc(a));
  return rows({title:"Sample transfer handoff outcomes by model",items,W,compact,max:20,ticks:[0,5,10,15,20],rightW:24,
    segs:m=>K.map(([k,c,t])=>({v:BI[m.id][k],c,t:`${t}: ${BI[m.id][k]} of 20`})),
    right:()=>""});
});

/* ---------- thinking scatter ---------- */
reg("das-thinkChart",(W,compact)=>{
  const H=compact?320:420,l=compact?44:64,r=compact?12:32,top=20,b=compact?44:52,pw=W-l-r,ph=H-top-b;
  const lx=v=>l+pw*(Math.log10(v)-Math.log10(200))/(Math.log10(8000)-Math.log10(200)),ly=v=>top+ph*(1-v/0.8);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tokens per decision versus progress"><title>Tokens per decision versus share of trials moving the target</title>`;
  [0,.2,.4,.6,.8].forEach(t=>{s+=`<line x1="${l}" x2="${W-r}" y1="${ly(t)}" y2="${ly(t)}" stroke="${C.line}" stroke-dasharray="3 4"/><text x="${l-8}" y="${ly(t)+4}" font-size="12" fill="${C.faint}" text-anchor="end">${t*100}%</text>`;});
  [250,500,1000,2000,4000,8000].forEach(t=>{s+=`<line x1="${lx(t)}" x2="${lx(t)}" y1="${top}" y2="${top+ph}" stroke="${C.line}" stroke-dasharray="3 4"/><text x="${lx(t)}" y="${top+ph+16}" font-size="12" fill="${C.faint}" text-anchor="middle">${t.toLocaleString()}</text>`;});
  s+=`<text x="${l+pw/2}" y="${H-6}" font-size="12" fill="${C.soft}" text-anchor="middle">Median tokens generated per decision</text>`;
  if(!compact) s+=`<text transform="translate(14 ${top+ph/2}) rotate(-90)" font-size="12" fill="${C.soft}" text-anchor="middle">Trials moving the target</text>`;
  const rad=compact?12:15, ico=compact?18:22;
  LLM.forEach((m,i)=>{const t=m.by_task.all,v=(t.stages[3]+t.stages[4]+t.stages[5])/t.n,x=lx(m.outtok),y=ly(v);
    s+=`<g class="das-pop das-pt" data-das-delay="${i*28}" style="cursor:pointer" data-das-tip="${esc(m.name)}|${m.outtok.toLocaleString()} tokens per decision|${m.latency.toFixed(1)} s per decision|${Math.round(v*100)}% of trials moved the target" data-das-x="${x}" data-das-y="${y}" tabindex="0"><circle cx="${x}" cy="${y}" r="${rad}" fill="transparent"/><image href="${LOGOS[m.org]}" x="${x-ico/2}" y="${y-ico/2}" width="${ico}" height="${ico}"/>`;
    s+=`</g>`;});
  return withDefs(s+`</svg>`);
});
/* shared hover tooltip: bars, dots and scatter logos all carry data-tip */
(function(){
  document.querySelectorAll(".das-chart").forEach(host=>{
    const card=host.parentElement; card.style.position="relative";
    const tip=document.createElement("div"); tip.className="das-tip"; tip.hidden=true; card.appendChild(tip);
    const place=(el,ev)=>{const cr=card.getBoundingClientRect(); let px,py;
      if(el.dataset.dasX){const svg=host.querySelector("svg"),r=svg.getBoundingClientRect(),sx=r.width/svg.viewBox.baseVal.width; px=r.left-cr.left+el.dataset.dasX*sx; py=r.top-cr.top+el.dataset.dasY*sx-(host.classList.contains("das-is-compact")?16:22);}
      else{px=ev.clientX-cr.left; py=ev.clientY-cr.top-14;}
      tip.style.left=Math.min(Math.max(px,120),cr.width-120)+"px"; tip.style.top=py+"px";};
    const mobile=()=>window.matchMedia("(max-width: 760px)").matches;
    const show=(el,ev)=>{const [head,...rest]=el.dataset.dasTip.split("|"); tip.innerHTML=`<b>${head}</b>`+rest.map(r=>`<span>${r}</span>`).join(""); tip.hidden=false; place(el,ev);
      host.querySelectorAll(".das-on").forEach(x=>x.classList.remove("das-on")); el.classList.add("das-on");
      const pt=el.closest(".das-pt"); if(pt){host.classList.add("das-hovering"); pt.classList.add("das-on");}else host.classList.remove("das-hovering");};
    const hide=()=>{tip.hidden=true; host.classList.remove("das-hovering"); host.querySelectorAll(".das-on").forEach(x=>x.classList.remove("das-on"));};
    host.addEventListener("pointerover",e=>{if(mobile())return; const el=e.target.closest("[data-das-tip]"); if(el) show(el,e);});
    host.addEventListener("pointermove",e=>{if(mobile())return; const el=e.target.closest("[data-das-tip]"); if(el&&!tip.hidden&&!el.dataset.dasX) place(el,e);});
    host.addEventListener("pointerout",e=>{if(mobile())return; const el=e.target.closest("[data-das-tip]"); if(el&&!(e.relatedTarget&&el.contains(e.relatedTarget))) hide();});
    host.addEventListener("click",e=>{const el=e.target.closest("[data-das-tip]"); if(mobile()){if(el&&el.classList.contains("das-on"))hide();else if(el)show(el,e);else hide();return;} if(el) show(el,e); else hide();});
    host.addEventListener("focusin",e=>{if(mobile())return; const el=e.target.closest("[data-das-tip]"); if(el) show(el,e);});
    host.addEventListener("focusout",()=>{if(mobile())return; hide();});
    host.addEventListener("pointerleave",()=>{if(mobile())return; hide();});
    host.addEventListener("pointermove",e=>{if(mobile())return; if(!e.target.closest("[data-das-tip]")) hide();});
    document.addEventListener("scroll",hide,{passive:true,capture:true});
  });
})();
document.getElementById("das-thinkKey").innerHTML=[...LLM].sort((a,b)=>a.outtok-b.outtok).map(m=>{const t=m.by_task.all,v=(t.stages[3]+t.stages[4]+t.stages[5])/t.n;return `<li><img src="${LOGOS[m.org]}" alt=""><b>${esc(m.name)}</b><span>${m.outtok.toLocaleString()} tokens · ${Math.round(v*100)}% moved · ${m.latency.toFixed(0)} s</span></li>`;}).join("");

/* ---------- expert review cards ---------- */
(function(){
  const dims=[["perception","Perception"],["execution","Execution"],["recovery","Recovery"],["handling","Careful handling"],["honesty","Honest reporting"]];
  const col=v=>v>=3.5?C.good:v>=2.5?C.accent:v>=1.75?C.warn:C.bad;
  const row=(l,v)=>v==null?`<div class="das-er-row das-na"><span class="das-lab">${l}</span><span class="das-track"></span><span class="das-val">—</span></div>`:`<div class="das-er-row"><span class="das-lab">${l}</span><span class="das-track"><i data-das-w="${v/5*100}"></i></span><span class="das-val">${v.toFixed(1)}</span></div>`;
  const host=document.getElementById("das-erGrid");
  host.innerHTML=ER.filter(e=>M.some(x=>x.id===e.id)).sort((a,b)=>b.overall-a.overall).map((e,i)=>{const m=M.find(x=>x.id===e.id);
    return `<article class="das-er-card" data-das-id="${e.id}"><div class="das-er-head"><img src="${LOGOS[m.org]}" alt=""><span class="das-name">${esc(m.name)}</span><span class="das-rank">#${i+1}</span><span class="das-overall"><i style="background:${col(e.overall)}"></i>${e.overall.toFixed(1)} overall</span></div><div class="das-er-rows">${dims.map(([k,l])=>row(l,e[k])).join("")}</div><div class="das-er-text"><span><b>Useful:</b> ${esc(e.use)}</span><span><b>Risk:</b> ${esc(e.watch)}</span></div></article>`;}).join("");
  /* rubric level bars */
  document.querySelectorAll(".das-rubric-grid li").forEach((li,i)=>{const lvl=(i%5)+1;const txt=document.createElement("span");txt.className="das-rtext";while(li.firstChild)txt.appendChild(li.firstChild);const s=document.createElement("span");s.className="das-rb";s.innerHTML=`<i data-das-w="${lvl*20}"></i>`;li.append(s,txt);});
  /* mobile: one model at a time, chosen from a tab strip */
  const erTabs=document.createElement("div"); erTabs.className="das-tabs das-mobile-tabs das-er-tabs"; erTabs.setAttribute("role","tablist"); erTabs.setAttribute("aria-label","Choose a model");
  erTabs.innerHTML=ER.filter(e=>M.some(x=>x.id===e.id)).sort((a,b)=>b.overall-a.overall).map((e,i)=>{const m=M.find(x=>x.id===e.id);return `<button type="button" class="das-btn" role="tab" data-das-id="${e.id}" aria-pressed="${i===0}"><img src="${LOGOS[m.org]}" alt="">${esc(m.name)}</button>`;}).join("");
  host.parentNode.insertBefore(erTabs,host);
  const replay=el=>{if(!el||REDUCED)return;el.classList.remove("das-in");void el.offsetWidth;el.classList.add("das-in");el.querySelectorAll(".das-track i,.das-rb i").forEach(i=>{i.style.transitionDelay="0ms";i.style.width="0";});requestAnimationFrame(()=>requestAnimationFrame(()=>el.querySelectorAll(".das-track i,.das-rb i").forEach((i,ri)=>{i.style.transitionDelay=ri*28+"ms";i.style.width=i.dataset.dasW+"%";})));};
  const pickModel=id=>{erTabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.dasId===id));host.querySelectorAll(".das-er-card").forEach(c=>c.classList.toggle("das-is-on",c.dataset.dasId===id));};
  erTabs.addEventListener("click",e=>{const b=e.target.closest("button");if(b){pickModel(b.dataset.dasId);replay(host.querySelector(".das-er-card.das-is-on"));b.scrollIntoView({block:"nearest",inline:"center",behavior:REDUCED?"auto":"smooth"});}});
  pickModel(ER.filter(e=>M.some(x=>x.id===e.id)).sort((a,b)=>b.overall-a.overall)[0].id);
  /* rubric: same pattern, one dimension at a time on mobile */
  const rgrid=document.querySelector(".das-rubric-grid");
  if(rgrid){const arts=[...rgrid.querySelectorAll("article")];const rt=document.createElement("div");rt.className="das-tabs das-mobile-tabs das-rubric-tabs";rt.setAttribute("role","tablist");rt.setAttribute("aria-label","Choose a dimension");
    rt.innerHTML=arts.map((a,i)=>`<button type="button" class="das-btn" role="tab" data-das-i="${i}" aria-pressed="${i===0}">${a.querySelector("h4").textContent}</button>`).join("");
    const anchor=rgrid.closest(".das-figure").querySelector(".das-figure-head"); anchor.after(rt);
    const pickDim=i=>{rt.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.dasI==i));arts.forEach((a,k)=>a.classList.toggle("das-is-on",k==i));};
    rt.addEventListener("click",e=>{const b=e.target.closest("button");if(b){pickDim(+b.dataset.dasI);replay(arts[+b.dataset.dasI]);b.scrollIntoView({block:"nearest",inline:"center",behavior:REDUCED?"auto":"smooth"});}});
    pickDim(0);}
  const playBars=(card,sel)=>card.querySelectorAll(sel).forEach((bar,ri)=>{bar.style.transitionDelay=ri*28+"ms";bar.style.width=bar.dataset.dasW+"%";});

/* ---------- edge fades on anything that scrolls sideways ---------- */
(function(){
  const els=[...document.querySelectorAll(".das-tabs, .das-tbl, .das-er-scroll, .das-ep-models")];
  els.forEach(el=>{
    const wrap=document.createElement("div"); wrap.className="das-scroll-wrap"; el.parentNode.insertBefore(wrap,el); wrap.appendChild(el);
    const update=()=>{const max=el.scrollWidth-el.clientWidth-1; wrap.classList.toggle("das-can-right",max>0&&el.scrollLeft<max); wrap.classList.toggle("das-can-left",el.scrollLeft>1);};
    /* subtle arrows over the fades to nudge the row */
    ["left","right"].forEach(dir=>{const a=document.createElement("button");a.type="button";a.className="das-scroll-arrow das-"+dir;a.setAttribute("aria-label",dir==="left"?"Scroll left":"Scroll right");
      a.innerHTML=dir==="left"?'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>':'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>';
      a.addEventListener("click",()=>el.scrollBy({left:(dir==="left"?-1:1)*Math.max(120,el.clientWidth*.6),behavior:REDUCED?"auto":"smooth"}));wrap.appendChild(a);});
    el.addEventListener("scroll",update,{passive:true}); window.addEventListener("resize",update); update(); setTimeout(update,300);
  });
})();

/* ---------- figure captions under each card, numbered in page order ---------- */
(function(){
  let n=0;
  document.querySelectorAll(".das-card, .das-video-figure").forEach(el=>{
    if(el.classList.contains("das-video-figure")){n++;const c=el.querySelector("figcaption");if(c)c.innerHTML=`<b>Figure ${n}.</b> `+c.innerHTML;return;}
    const h=el.querySelector(".das-chart-head h3"); if(!h) return;
    n++; const p=el.querySelector(".das-chart-head p");
    const cap=document.createElement("p"); cap.className="das-figcap";
    cap.innerHTML=`<b>Figure ${n}.</b> `+(p?p.innerHTML:"");
    const tk=el.querySelector(".das-takeaway");
    if(tk) el.insertBefore(cap,tk); else el.appendChild(cap);
  });
})();

/* ---------- operating-room video: desktop scroll autoplay, manual mobile playback ---------- */
(function(){
  const v=document.getElementById("das-envVideo"),b=document.getElementById("das-envPlay"),loader=document.getElementById("das-envLoad"); if(!v||!b) return;
  const desktop=()=>window.matchMedia("(min-width: 761px)").matches;
  const set=on=>{b.setAttribute("aria-pressed",String(on));b.setAttribute("aria-label",on?"Pause":"Play");};
  const loading=on=>{if(loader)loader.hidden=!on;};
  const toggle=()=>{if(v.paused){if(v.ended)v.currentTime=0;v.play().then(()=>set(true)).catch(()=>{});}else{v.pause();set(false);}};
  b.addEventListener("click",e=>{e.stopPropagation();toggle();});
  v.addEventListener("click",toggle);
  v.addEventListener("ended",()=>set(false));
  ["waiting","stalled"].forEach(type=>v.addEventListener(type,()=>loading(true)));
  ["playing","canplay","seeked","ended","pause"].forEach(type=>v.addEventListener(type,()=>loading(false)));
  if("IntersectionObserver" in window){
    const io=new IntersectionObserver(entries=>entries.forEach(entry=>{
      if(!desktop())return;
      if(entry.isIntersecting)v.play().then(()=>set(true)).catch(()=>{});
      else{v.pause();set(false);}
    }),{threshold:.5});
    io.observe(v);
  }
  window.matchMedia("(min-width: 761px)").addEventListener("change",e=>{if(!e.matches){v.pause();set(false);}});
})();

/* ---------- scroll reveal (one pass, respects reduced motion) ---------- */
(function(){
  const els=document.querySelectorAll(".das-reveal, .das-chart");
  if(REDUCED||!("IntersectionObserver" in window)){els.forEach(e=>{e.classList.add("das-is-in");if(e.classList.contains("das-chart"))finishChart(e);});return;}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("das-is-in");if(e.target.classList.contains("das-chart"))animateChart(e.target);io.unobserve(e.target);}}),{rootMargin:"0px 0px -8% 0px",threshold:.08});
  els.forEach(e=>io.observe(e));
})();
</script>
