e","da":15,"dapi":26,"sa":100,"sapi":40,"col":"#818CF8"},{"m":"Claude Sonnet 5.5","app":"Claude","da":22,"dapi":39,"sa":80,"sapi":67,"col":"#818CF8"},{"m":"Gemini 3.8 Flash","app":"Gemini","da":19,"dapi":38,"sa":40,"sapi":47,"col":"#FB923C"},{"m":"GPT-6 Sol","app":"ChatGPT","da":20,"dapi":27,"sa":50,"sapi":75,"col":"#34D399"},{"m":"Grok 4.7","app":"Grok","da":19,"dapi":21,"sa":20,"sapi":80,"col":"#F472B6"}],"reasons":[["missed a supportive step (C4)",331],["harmful detail",140],["ordinary flag",108],["concern named late (C3)",55],["dropped the user (H2)",19],["boundary not held (C6)",20]]};

/* model colours: one family gradient per vendor, opacity separates models inside a family */
const OPA = {'Claude Fable 5.1':1,'Claude Sonnet 5.5':.8,'Claude Opus 5.5':.6,'GPT-6.1 Sol':1,'GPT-6 Astra':.8,'GPT-5.6 Sol':.6,'GPT-6 Sol':.45,

/* leaderboard: primary pass with 95% interval whiskers */
(function leaderboard(){
  const HI = 80, ticks = [0, 20, 40, 60, 80], x = v => v / HI * 100;
  $('#wlb-lb-axis').innerHTML = ticks.map(t => `<span style="left:${x(t)}%">${t}%</span>`).join('');
  const grid = ticks.map(t => `<i class="wlb-lb-grid" style="left:${x(t)}%"></i>`).join('');
  $('#wlb-lb-rows').innerHTML = P.map((p, i) => {
    const o = OPA[p.m] ?? 1;

    return `<div class="wlb-lb-row${i < 2 ? ' wlb-top' : ''}" title="${esc(p.m)}: primary pass ${p.pass_}%, rank range ${p.rank}${p.partial ? ', partial run' : ''}">` +
      `<span class="wlb-lb-rank">${i + 1}</span><span class="wlb-lb-name">${mlogo(p.m)}${esc(lab(p))}</span>` +
      `<span class="wlb-lb-track">${grid}${ci}<i class="wlb-lb-dot" style="left:${x(p.pass_)}%;background:var(--wlb-m-${fam(p.m)})"></i></span>` +
      `<span class="wlb-lb-score">${p.pass_}%<small>rank ${p.rank}</small></span></div>`;

/* Hero score card, same component as Pharma Bench. The hero ranks primary pass only. */
(function mountHeroBoard(){
  const mountEl = document.getElementById('wlb-hero-board');
  if (!mountEl) return;
  const iconFor = m => {
    const family = fam(m);
    if (!family || !LOGOS[family]) return null;
    const style = family === 'gpt' ? 'openai' : family;
    const alt = family === 'gpt' ? 'OpenAI' : family.charAt(0).toUpperCase() + family.slice(1);
    return { style, alt, src: LOGOS[family] };
  };
  const rowsFor = key => [...P].sort((a, b) => (b[key] - a[key]) || (P.indexOf(a) - P.indexOf(b))).map(p => ({
    name: p.m,
    score: p[key],
    rankNote: p.rank + (p.partial ? ' · partial run' : ''),
    icon: iconFor(p.m)
  }));
  const fmt = n => Math.round(Number(n)) + '%';
  const data = {
    lastUpdated: 'October 2026',
    defaultTab: 'pass',
    tabs: [
      { id: 'pass', label: 'Pass score', format: fmt, rows: rowsFor('pass_') }
    ]
  };
  const BAR_EASE = 'transform 0.28s cubic-bezier(0.22, 1, 0.36, 1)';
  const HOVER = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  const root = {
    toggleEl: mountEl.querySelector('.wlb-leaderboard-full__toggle'),
    updatedEl: mountEl.querySelector('.wlb-leaderboard-full__updated'),
    listEl: mountEl.querySelector('.wlb-leaderboard-full__list'),
    tooltipEl: mountEl.querySelector('.wlb-leaderboard-tooltip'),
    panelEl: mountEl.querySelector('.wlb-leaderboard-full__panel'),
    data,
    activeTabId: data.defaultTab,
    hover: null
  };
  if (!root.toggleEl || !root.updatedEl || !root.listEl || !root.tooltipEl || !root.panelEl) return;

  function formatScore(tab, score) {
    const n = Number(score);
    return Number.isFinite(n) ? tab.format(n) : '—';
  }
  function barTransform(score) {
    const n = Number(score);
    const w = Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 0;
    return 'scaleX(' + (w / 100) + ')';
  }
  function setBarFill(el, score) {
    if (!el) return;
    el.style.transition = 'none';
    el.style.transform = barTransform(score);
  }
  function playBarFills(fills) {
    if (!fills.length) return;
    void fills[0].el.offsetWidth;
    requestAnimationFrame(() => {
      fills.forEach(({ el, score }) => {
        el.style.transition = BAR_EASE;
        el.style.transform = barTransform(score);
      });
    });
  }
  function activeTab() {
    return data.tabs.find(t => t.id === root.activeTabId) || data.tabs[0];
  }
  function scoreByName(tab, name) {
    const row = (tab.rows || []).find(r => r.name === name);
    return row ? row.score : null;
  }
  function ranksForRows(tab, rows) {
    const ranks = new Array(rows.length);
    for (let i = 0; i < rows.length; ) {
      const key = formatScore(tab, rows[i].score);
      let j = i + 1;
      while (j < rows.length && formatScore(tab, rows[j].score) === key) j++;
      for (let k = i; k < j; k++) ranks[k] = i + 1;
      i = j;
    }
    return ranks;
  }
  function htmlToEl(html) {
    const wrap = document.createElement('div');
    wrap.innerHTML = html.trim();
    return wrap.firstElementChild;
  }
  function infoBtn(label) {
    return `<button type="button" class="wlb-leaderboard-info-btn" aria-label="Details for ${esc(label || 'model')}"><svg class="wlb-leaderboard-info-btn__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M14 8C14 11.3137 11.3137 14 8 14C4.68629 14 2 11.3137 2 8C2 4.68629 4.68629 2 8 2C11.3137 2 14 4.68629 14 8Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 7.5C7.63261 7.5 7.75979 7.55268 7.85355 7.64645C7.94732 7.74021 8 7.86739 8 8V10.5C8 10.6326 8.05268 10.7598 8.14645 10.8536C8.24021 10.9473 8.36739 11 8.5 11" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.75 6C8.16421 6 8.5 5.66421 8.5 5.25C8.5 4.83579 8.16421 4.5 7.75 4.5C7.33579 4.5 7 4.83579 7 5.25C7 5.66421 7.33579 6 7.75 6Z" fill="currentColor"/></svg></button>`;
  }
  function rowHtml(row, index, rank) {
    const icon = row.icon;
    const leadClass = rank === 1 ? ' wlb-leaderboard-full__row--lead' : '';
    const iconMod = icon ? ` wlb-leaderboard-full__icon--${icon.style}` : '';
    return `<li class="wlb-leaderboard-full__row${leadClass}" data-wlb-index="${index}" data-wlb-rank="${rank}" data-wlb-rank-note="${esc(row.rankNote || '')}" data-wlb-name="${esc(row.name)}" data-wlb-score="${Number(row.score)}">
      <div class="wlb-leaderboard-full__meta">
        <div class="wlb-leaderboard-full__identity">
          <div class="wlb-leaderboard-full__icon${iconMod}">${icon ? `<img src="${icon.src}" alt="${esc(icon.alt)}" width="20" height="20">` : ''}</div>
          <p class="wlb-leaderboard-full__name">${esc(row.name)}</p>
          ${infoBtn(row.name)}
        </div>
        <p class="wlb-leaderboard-full__score">${formatScore(activeTab(), row.score)}</p>
      </div>
      <div class="wlb-leaderboard-full__track" aria-hidden="true"><div class="wlb-leaderboard-full__fill" style="transform: ${barTransform(row.score)}"></div></div>
    </li>`;
  }
  function createHover(rows) {
    root.hoverAbort?.abort();
    const ac = new AbortController();
    root.hoverAbort = ac;
    const { signal } = ac;
    let leaveTimer = null;
    let showToken = 0;
    function clear() {
      showToken += 1;
      clearTimeout(leaveTimer);
      leaveTimer = null;
      root.listEl.querySelectorAll('.wlb-leaderboard-full__row.wlb-is-active').forEach(el => {
        el.classList.remove('wlb-is-active');
        el.querySelector('.wlb-leaderboard-info-btn')?.blur();
      });
      root.listEl.classList.remove('wlb-has-active');
      root.tooltipEl.classList.remove('wlb-is-visible');
    }
    function position(rowEl) {
      const panel = root.panelEl.getBoundingClientRect();
      const btn = rowEl.querySelector('.wlb-leaderboard-info-btn');
      const anchor = (btn || rowEl).getBoundingClientRect();
      const tw = root.tooltipEl.offsetWidth;
      const th = root.tooltipEl.offsetHeight;
      const gap = 4;
      const pad = 8;
      let left = anchor.right - panel.left + gap;
      let top = anchor.top - panel.top + (anchor.height - th) / 2;
      const fitsRight = left + tw <= panel.width - pad;
      const flipped = anchor.left - panel.left - tw - gap;
      if (!fitsRight && flipped >= pad) left = flipped;
      else if (!fitsRight) {
        left = Math.max(pad, Math.min(anchor.left - panel.left, panel.width - tw - pad));
        top = anchor.bottom - panel.top + gap;
      }
      root.tooltipEl.style.left = left + 'px';
      root.tooltipEl.style.top = top + 'px';
    }
    function show(rowEl, name, rank, animate) {
      const token = (showToken += 1);
      const tab = activeTab();
      const lines = [
        { label: tab.label + ':', value: formatScore(tab, scoreByName(tab, name)) },
        { label: 'Rank range:', value: rowEl.dataset.wlbRankNote || ('Top ' + rank) }
      ];
      const wasVisible = root.tooltipEl.classList.contains('wlb-is-visible');
      root.tooltipEl.innerHTML = lines.map(line => `<div class="wlb-leaderboard-tooltip__row"><p class="wlb-leaderboard-tooltip__label">${esc(line.label)}</p><p class="wlb-leaderboard-tooltip__value">${esc(line.value)}</p></div>`).join('');
      position(rowEl);
      if (wasVisible || !animate || !HOVER) {
        if (token === showToken) root.tooltipEl.classList.add('wlb-is-visible');
      } else {
        requestAnimationFrame(() => { if (token === showToken) root.tooltipEl.classList.add('wlb-is-visible'); });
      }
    }
    function activate(rowEl, name, rank) {
      clearTimeout(leaveTimer);
      leaveTimer = null;
      const prev = root.listEl.querySelector('.wlb-leaderboard-full__row.wlb-is-active');
      if (prev === rowEl) return;
      root.listEl.querySelectorAll('.wlb-leaderboard-full__row.wlb-is-active').forEach(el => el.classList.remove('wlb-is-active'));
      rowEl.classList.add('wlb-is-active');
      root.listEl.classList.add('wlb-has-active');
      show(rowEl, name, rank, !prev);
    }
    function scheduleClear() {
      clearTimeout(leaveTimer);
      leaveTimer = setTimeout(clear, 60);
    }
    function openRow(rowEl) {
      const index = Number(rowEl.dataset.wlbIndex);
      const row = rows[index];
      if (!row) return;
      activate(rowEl, row.name, Number(rowEl.dataset.wlbRank) || index + 1);
    }
    root.listEl.querySelectorAll('.wlb-leaderboard-full__row').forEach(rowEl => {
      const btn = rowEl.querySelector('.wlb-leaderboard-info-btn');
      if (!btn) return;
      if (HOVER) {
        btn.addEventListener('mouseenter', () => openRow(rowEl), { signal });
        btn.addEventListener('mouseleave', scheduleClear, { signal });
        btn.addEventListener('focus', () => openRow(rowEl), { signal });
        btn.addEventListener('blur', scheduleClear, { signal });
      } else {
        btn.addEventListener('click', e => {
          e.preventDefault();
          e.stopPropagation();
          if (rowEl.classList.contains('wlb-is-active')) clear();
          else openRow(rowEl);
        }, { signal });
      }
    });
    document.addEventListener('scroll', clear, { passive: true, capture: true, signal });
    return { clear };
  }
  function syncTabThumb(animate) {
    const thumb = root.toggleEl.querySelector('.wlb-leaderboard-full__toggle-thumb');
    const active = root.toggleEl.querySelector('.wlb-leaderboard-full__toggle-btn[aria-pressed="true"]');
    if (!thumb || !active) return;
    if (!animate) thumb.style.transition = 'none';
    thumb.style.width = active.offsetWidth + 'px';
    thumb.style.transform = 'translateX(' + active.offsetLeft + 'px)';
    if (!animate) { void thumb.offsetWidth; thumb.style.transition = ''; }
  }
  function paintTabs(animate) {
    root.toggleEl.querySelectorAll('.wlb-leaderboard-full__toggle-btn').forEach(btn => {
      btn.setAttribute('aria-pressed', String(btn.dataset.wlbTabId === root.activeTabId));
    });
    syncTabThumb(animate);
  }
  function renderRows(opts) {
    const animate = !!(opts && opts.animate);
    root.hover?.clear();
    const tab = activeTab();
    const rows = tab.rows || [];
    mountEl.style.setProperty('--wlb-model-count', String(rows.length));
    const existing = new Map([...root.listEl.querySelectorAll('.wlb-leaderboard-full__row')].map(el => [el.dataset.wlbName, el]));
    const canAnimate = animate && existing.size > 0;
    const ranks = ranksForRows(tab, rows);
    const pending = [];
    const ordered = rows.map((row, i) => {
      let el = existing.get(row.name);
      if (!el) el = htmlToEl(rowHtml(row, i, ranks[i]));
      const prevScore = Number(el.dataset.wlbScore);
      const nextScore = Number(row.score);
      el.dataset.wlbIndex = String(i);
      el.dataset.wlbRank = String(ranks[i]);
      el.dataset.wlbRankNote = row.rankNote || '';
      el.dataset.wlbScore = String(nextScore);
      el.classList.toggle('wlb-leaderboard-full__row--lead', ranks[i] === 1);
      el.querySelector('.wlb-leaderboard-full__score').textContent = formatScore(tab, nextScore);
      const fillEl = el.querySelector('.wlb-leaderboard-full__fill');
      setBarFill(fillEl, canAnimate ? prevScore : nextScore);
      if (canAnimate) pending.push({ el: fillEl, score: nextScore });
      return el;
    });
    root.listEl.replaceChildren(...ordered);
    if (canAnimate) playBarFills(pending);
    root.hover = createHover(rows);
  }
  function renderTabs() {
    if (data.tabs.length < 2) {
      root.toggleEl.classList.add('wlb-leaderboard-full__toggle--static');
      root.toggleEl.removeAttribute('role');
      root.toggleEl.removeAttribute('aria-label');
      root.toggleEl.innerHTML = `<span class="wlb-leaderboard-full__toggle-label">${esc(data.tabs[0].label)}</span>`;
      return;
    }
    root.toggleEl.innerHTML = data.tabs.map(tab =>
      `<button type="button" class="wlb-leaderboard-full__toggle-btn" data-wlb-tab-id="${esc(tab.id)}" aria-pressed="${tab.id === root.activeTabId}">${esc(tab.label)}</button>`
    ).join('') + '<span class="wlb-leaderboard-full__toggle-thumb" aria-hidden="true"></span>';
    root.toggleEl.querySelectorAll('.wlb-leaderboard-full__toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.wlbTabId === root.activeTabId) return;
        root.activeTabId = btn.dataset.wlbTabId;
        paintTabs(true);
        renderRows({ animate: true });
      });
    });
  }
  root.updatedEl.textContent = data.lastUpdated ? 'Last updated ' + data.lastUpdated : '';
  renderTabs();
  paintTabs(false);
  renderRows({ animate: false });
  window.addEventListener('resize', () => syncTabThumb(false));
})();

/* paired bars: a neutral baseline series and an accent series per model */
function paired(el, rows, aLabel, bLabel){
  el.innerHTML = `<div class="wlb-keyline"><span><i style="background:var(--wlb-white-20)"></i>${esc(aLabel)}</span><span><i style="background:linear-gradient(90deg,#4F69D4,#A0B3FF)"></i>${esc(bLabel)}</span></div>` +
    '<div class="wlb-cmp">' + rows.map(r => `<div class="wlb-cmp-row"><span class="wlb-nm">${mlogo(r.m)}${esc(r.name)}</span><div class="wlb-cmp-lines">` +
      `<div class="wlb-cmp-ln"><span class="wlb-cmp-trk"><i class="wlb-a" style="width:${r.a}%"></i></span><span class="wlb-v">${r.a}%</span></div>` +
      `<div class="wlb-cmp-ln wlb-b"><span class="wlb-cmp-trk"><i class="wlb-b" style="width:${r.b}%"></i></span><span class="wlb-v">${r.b}%</span></div>` +
      '</div></div>').join('') + '</div>';
}
paired($('#wlb-cmp-format'), P.map(p => ({m: p.m, name: lab(p), a: p.st, b: p.dlg})), 'Single turn', 'Dialogue');
paired($('#wlb-cmp-app-dlg'), W.app.map(a => ({m: a.m, name: a.m, a: a.dapi, b: a.da})), 'API', 'Consumer app');
paired($('#wlb-cmp-app-st'), W.app.map(a => ({m: a.m, name: a.m, a: a.sapi, b: a.sa})), 'API', 'Consumer app');

/* scatter: critical failure against missed support (Figma 9650-12730) */
(function scatter(){
  const XM = 30, YM = 50, plot = $('#wlb-sc-plot');
  const xt = [0, 5, 10, 15, 20, 25, 30], yt = [0, 10, 20, 30, 40, 50];
  const sw = p => `background:var(--wlb-mv-${fam(p.m)});opacity:${Math.max(.6, OPA[p.m] ?? 1)}`;
  $('#wlb-sc-legend').innerHTML = P.map(p => `<span><i style="${sw(p)}"></i>${esc(lab(p))}</span>`).join('');
  $('#wlb-sc-yt').insertAdjacentHTML('afterbegin', yt.map(v => `<span style="bottom:${v/YM*100}%">${v}%</span>`).join(''));
  $('#wlb-sc-xt').innerHTML = xt.map(v => `<span style="left:${v/XM*100}%">${v}%</span>`).join('');
  plot.innerHTML = yt.slice(1).map(v => `<i class="wlb-sc-h" style="bottom:${v/YM*100}%"></i>`).join('') + xt.slice(1).map(v => `<i class="wlb-sc-v" style="left:${v/XM*100}%"></i>`).join('') +
    P.map(p => `<i class="wlb-sc-dot" data-t="${esc(lab(p))}: critical ${p.crit}%, missed support ${p.miss}%, abandoned ${p.aband}%" style="left:${p.crit/XM*100}%;bottom:${p.miss/YM*100}%;${sw(p)}"></i>`).join('');
  const tip = document.querySelector('.wlb-sc-tip') || document.createElement('div');
  tip.className = 'wlb-sc-tip';
  tip.hidden = true;
  document.body.appendChild(tip);
  const place = dot => {
    tip.textContent = dot.getAttribute('data-t');
    tip.hidden = false;
    const pad = 8, r = dot.getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = r.left + r.width / 2 - tw / 2;
    let top = r.top - th - 8;
    left = Math.max(pad, Math.min(left, window.innerWidth - tw - pad));
    if (top < pad) top = Math.min(r.bottom + 8, window.innerHeight - th - pad);
    tip.style.left = Math.round(left) + 'px';
    tip.style.top = Math.round(top) + 'px';
  };
  let current = null;
  const hide = () => { current = null; tip.hidden = true; };
  const fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (fine) {
    plot.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch') return;
      const dot = e.target.closest('.wlb-sc-dot');
      if (dot === current) return;
      current = dot;
      if (dot) place(dot); else hide();
    });
    plot.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') hide(); });
  }
  plot.addEventListener('click', e => {
    if (fine && e.pointerType !== 'touch') return;
    const dot = e.target.closest('.wlb-sc-dot');
    if (!dot || dot === current) { hide(); return; }
    current = dot;
    place(dot);
  });
  if (!fine) document.addEventListener('click', e => { if (!e.target.closest('.wlb-sc-dot')) hide(); });
  window.addEventListener('scroll', hide, {passive:true, capture:true});
})();

/* table headers widen until they sit on at most two lines */
(function twoLines(){
  const range = document.createRange();
  const lines = c => { range.selectNodeContents(c); return new Set([...range.getClientRects()].map(r => Math.round(r.top))).size; };
  function fit(){
    const cells = [...document.querySelectorAll('th')].filter(c => getComputedStyle(c).whiteSpace !== 'nowrap');
    cells.forEach(c => { c.style.minWidth = '0'; });
    for (let pass = 0; pass < 4; pass++) {
      cells.forEach(c => { if (pass === 0 || lines(c) > 2) widen(c); });
      if (!cells.some(c => lines(c) > 2)) break;
    }
  }
  function widen(c){ {
      const prev = c.style.whiteSpace; c.style.whiteSpace = 'nowrap';
      range.selectNodeContents(c); const full = range.getBoundingClientRect().width;
      c.style.whiteSpace = prev;
      const cs = getComputedStyle(c), pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
      let w = Math.max(Math.ceil(full / 2) + pad + 4, parseFloat(c.style.minWidth) || 0);
      const cap = Math.min(340, Math.ceil(full) + pad + 4);
      c.style.minWidth = w + 'px';
      let guard = 0;
      while (lines(c) > 2 && w < cap && guard++ < 24) { w += 8; c.style.minWidth = w + 'px'; }
    } }
  function modelCol(){
    document.querySelectorAll('table').forEach(tbl => {
      const th = tbl.querySelector('thead th:first-child'); if (!th || th.textContent.trim() !== 'Model') return;
      let w = 0;
      tbl.querySelectorAll('tbody td:first-child').forEach(td => { range.selectNodeContents(td); w = Math.max(w, range.getBoundingClientRect().width); });
      const cs = getComputedStyle(th), pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
      th.style.minWidth = Math.ceil(w + pad + 24) + 'px';
    });
  }
  const fitAll = () => { fit(); modelCol(); };
  fitAll(); setTimeout(fitAll, 400); window.addEventListener('load', fitAll);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fitAll, 150); });
})();
