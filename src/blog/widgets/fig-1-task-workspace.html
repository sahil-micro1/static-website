<script>
(function(){
  var root=document.querySelector('.tr-widget-fig1');
  if(!root||root.dataset.bound)return;
  root.dataset.bound='1';
  var fix=root.querySelector('#d1-fix');
  if(!fix)return;
  fix.addEventListener('click',function(){
    var on=fix.getAttribute('aria-pressed')!=='true';
    fix.setAttribute('aria-pressed',String(on));
    root.querySelectorAll('#demo-1 .x').forEach(function(li){
      li.classList.toggle('struck',on);
      li.classList.toggle('flag',!on);
    });
    var s=root.querySelector('#d1-score');
    s.textContent=on?'3 of 3 · 100%':'3 of 5 · 60%';
    s.classList.toggle('lost',!on);
    fix.textContent=on?'Restore the original rubric':'Apply the proposed fix';
    root.querySelector('#d1-decision').textContent=on
      ?'Items 4 and 5 removed. A complete answer now earns full credit.'
      :'Remove items 4 and 5. The expert can also widen the prompt instead.';
  });
})();
</script>
