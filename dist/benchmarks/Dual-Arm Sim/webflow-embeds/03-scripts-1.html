const PAL={blue:"#3E55AB",gold:"#A38543",purple:"#785FA1",green:"#578265",white:"#BDBDBD"};

/* gradient fills: every bar in the document gets a slight gradient (horizontal: darker -> full colour; vertical: full -> darker) */
const gradId=new Map();
function gradFill(color,dir="h"){const key=dir+"|"+color; if(!gradId.has(key)) gradId.set(key,"g"+gradId.size); return "url(#"+gradId.get(key)+")";}
function gradDefs(){let d="<defs>"; gradId.forEach((id,key)=>{const [dir,c]=key.split("|"); const a=dir==="h"?'x1="0" x2="1" y1="0" y2="0"':'x1="0" x2="0" y1="0" y2="1"'; const s0='stop-opacity:.82', s1=dir==="h"?'stop-opacity:.5':'stop-opacity:.45'; d+=`<linearGradient id="${id}" ${a}><stop offset="0" style="stop-color:${c};${s0}"/><stop offset="1" style="stop-color:${c};${s1}"/></linearGradient>`;}); return d+"</defs>";}
function withDefs(s){return s.replace(/<\/svg>$/,gradDefs()+"</svg>");}
const TASKS=[["all","All tasks"],["instrument_swap","Instrument swap"],["cartridge_swap","Cartridge swap"],["sample_transfer","Sample transfer"],["parts_kitting","Parts kitting"]];

const REDUCED=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- chart registry: every chart re-renders for the width it actually has ---------- */
const CHARTS=[];
function reg(id,fn){const host=document.getElementById(id);if(host)CHARTS.push({host,fn,w:0});}
function dimsOf(host){const cw=Math.round(host.clientWidth||980);const compact=cw<640;return{compact,W:compact?Math.max(cw,280):Math.max(cw,640)};}
function renderChart(c,anim){const d=dimsOf(c.host);c.w=d.W;c.host.classList.toggle("das-is-compact",d.compact);c.host.innerHTML=c.fn(d.W,d.compact);
  zeroChart(c.host);
  if(!anim||REDUCED)finishChart(c.host);            /* resize re-render: no replay */
  else if(c.host.classList.contains("das-is-in"))animateChart(c.host); /* already on screen (tab change) */
  /* otherwise the scroll observer animates it the moment it enters the viewport */}
function renderAll(anim){CHARTS.forEach(c=>renderChart(c,anim));}
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{CHARTS.forEach(c=>{if(Math.abs(dimsOf(c.host).W-c.w)>24)renderChart(c,false);});},120);});

function label(m,x,y,size=22){

}
const bar=(x,y,w,h,fill,title,i=0,extra="",cls="das-bar")=>cls.includes("up")
  ?`<rect class="${cls}" data-das-delay="${i*35}" x="${x}" y="${y+h}" width="${w}" height="0" data-das-y="${y}" data-das-h="${h}" fill="${gradFill(fill,"v")}" ${title?`data-das-tip="${esc(title)}"`:""} ${extra}/>`
  :`<rect class="${cls}" data-das-delay="${i*60}" x="${x}" y="${y}" width="0" height="${h}" data-das-w="${w}" fill="${gradFill(fill,"h")}" ${title?`data-das-tip="${esc(title)}"`:""} ${extra}/>`;
/* in-view animation: the same grow-on-scroll logic the expert-review bars use, applied to every chart element */
const easeOut=x=>1-Math.pow(1-x,3);
function chartTargets(host){
  const items=[];
  host.querySelectorAll("[data-das-w]").forEach(e=>items.push({e,k:"w",v:+e.dataset.dasW,d:+e.dataset.dasDelay||0,start:e.hasAttribute("data-das-start")?+e.dataset.dasStart:0,span:e.hasAttribute("data-das-span")?+e.dataset.dasSpan:1}));
  host.querySelectorAll("[data-das-h]").forEach(e=>items.push({e,k:"h",v:+e.dataset.dasH,y:+e.dataset.dasY,d:+e.dataset.dasDelay||0}));
  host.querySelectorAll(".das-pop").forEach((e,i)=>{if(e.tagName==="circle"&&!e.dataset.dasR)e.dataset.dasR=e.getAttribute("r");const pt=e.classList.contains("das-pt");items.push({e,k:"o",d:(+e.dataset.dasDelay||i*35)+(pt?0:250),dur:pt?260:0,r:e.tagName==="circle"?+e.dataset.dasR:null});});
  host.querySelectorAll(".das-fade").forEach((e,i)=>items.push({e,k:"o",d:(+e.dataset.dasDelay||i*20)+450}));
  return items;
}
function zeroChart(host){chartTargets(host).forEach(it=>{if(it.k==="o"){if(it.dur)it.e.style.transition="none";it.e.style.opacity=0;if(it.r!=null)it.e.setAttribute("r",0);}});}
function finishChart(host){chartTargets(host).forEach(it=>{if(it.k==="w")it.e.setAttribute("width",it.v);else if(it.k==="h"){it.e.setAttribute("y",it.y);it.e.setAttribute("height",it.v);}else{it.e.style.opacity="";it.e.style.transition="";if(it.r!=null)it.e.setAttribute("r",it.r);}});}
function animateChart(host){
  if(REDUCED){finishChart(host);return;}
  const items=chartTargets(host), t0=performance.now(), DUR=700;
  (function frame(now){
    let live=false;
    items.forEach(it=>{const dur=it.dur||DUR; const u=Math.min(1,Math.max(0,(now-t0-it.d)/dur)); if(u<1)live=true; const e=it.span===1&&!it.start?easeOut(u):Math.min(1,Math.max(0,(easeOut(u)-(it.start||0))/(it.span||1)));
      if(it.k==="w")it.e.setAttribute("width",it.v*e);
      else if(it.k==="h"){it.e.setAttribute("y",it.y+it.v*(1-e));it.e.setAttribute("height",it.v*e);}
      else{
        if(u<1)it.e.style.opacity=e;
        else if(it.e.style.opacity!==""){it.e.style.opacity="";if(it.dur){const el=it.e;requestAnimationFrame(()=>{el.style.transition="";});}}
        if(it.r!=null)it.e.setAttribute("r",it.r*e);}});
    if(live)requestAnimationFrame(frame);
  })(t0);
}

/* generic horizontal row chart: compact mode stacks label above the bar */
function rows({items,max,segs,right,rightHead="",ticks=[],tickFmt=v=>v,W=980,compact=false,rowH=40,labelW=210,rightW=150,title}){
  if(compact){labelW=0;rightW=0;rowH=60;}
  const pad=compact?4:0, top=ticks.length?28:12, H=top+items.length*rowH+8;
  const x0=compact?pad:labelW, pw=compact?W-2*pad:W-labelW-rightW-16;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>`;
  ticks.forEach(t=>{const x=x0+pw*t/max;s+=`<line x1="${x}" x2="${x}" y1="${top-6}" y2="${H-6}" stroke="${C.line}" stroke-dasharray="3 4"/><text x="${x}" y="${top-12}" font-size="12" fill="${C.faint}" text-anchor="${compact&&t===max?"end":compact&&t===0?"start":"middle"}">${tickFmt(t)}</text>`;});
  if(rightHead&&!compact) s+=`<text x="${W-rightW+12}" y="${top-12}" font-size="12" fill="${C.faint}">${esc(rightHead)}</text>`;
  items.forEach((m,i)=>{
    const y=top+i*rowH+rowH/2, id="clip"+(uid++);
    s+=`<g class="das-row-hit"><rect class="das-row-bg" x="0" y="${y-rowH/2+2}" width="${W}" height="${rowH-4}" rx="4"/>`;
    let by,bh;
    if(compact){s+=label(m,pad,y-14,20);s+=`<text x="${W-pad}" y="${y-9}" font-size="13" fill="${C.soft}" text-anchor="end">${right(m)}</text>`;by=y+4;bh=16;}
    else{s+=label(m,8,y);by=y-9;bh=18;}
    const parts=[]; let x=x0;
    segs(m).forEach(g=>{const w=pw*g.v/max; if(w>0){parts.push({...g,w,x}); x+=w;}});
    s+=`<clipPath id="${id}"><rect x="${x0}" y="${by}" width="${pw}" height="${bh}"/></clipPath><g clip-path="url(#${id})"><rect x="${x0}" y="${by}" width="${pw}" height="${bh}" fill="${C.track}"/>`;
    if(parts.length<2){
      const grow=parts.reduce((a,g)=>a+Math.max(g.w,2),0);
      s+=`<clipPath id="${id}g"><rect x="${x0}" y="${by}" width="0" height="${bh}" data-das-w="${grow}" data-das-delay="${i*60}"/></clipPath><g clip-path="url(#${id}g)">`;
      parts.forEach(g=>{s+=`<rect class="das-seg" x="${g.x}" y="${by}" width="${Math.max(g.w,2)}" height="${bh}" fill="${gradFill(g.c,"h")}" data-das-tip="${esc(m.name+"|"+g.t)}"/>`;});
      s+=`</g>`;
    }else{
      const total=parts.reduce((a,g)=>a+g.w,0); let acc=0;
      parts.forEach((g,k)=>{const cid=id+"s"+k,start=acc/total,span=g.w/total;
        s+=`<clipPath id="${cid}"><rect x="${g.x}" y="${by}" width="0" height="${bh}" data-das-w="${g.w}" data-das-delay="${i*60}" data-das-start="${start}" data-das-span="${span}"/></clipPath>`;
        s+=`<rect class="das-seg" clip-path="url(#${cid})" x="${g.x}" y="${by}" width="${g.w}" height="${bh}" fill="${gradFill(g.c,"h")}" data-das-tip="${esc(m.name+"|"+g.t)}"/>`;
        acc+=g.w;});
    }
    s+=`</g>`;
    if(!compact) s+=`<text x="${W-rightW+12}" y="${y+5}" font-size="13" fill="${C.soft}">${right(m)}</text>`;
    s+=`</g>`;
  });
  return withDefs(s+`</svg>`);
}
function tabs(host,cur,on){host.innerHTML=TASKS.map(([k,l])=>`<button type="button" class="das-btn" data-das-k="${k}" aria-pressed="${k===cur}">${l}</button>`).join("");host.querySelectorAll("button").forEach(b=>b.onclick=()=>{host.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));on(b.dataset.dasK);});}
document.getElementById("das-stageLegend").innerHTML=ST_LAB.map((l,i)=>`<span><i style="background:${ST_COL[i]}"></i>${l}</span>`).join("");

/* ---------- leaderboard chart ---------- */
let lbTask="all";
reg("das-lbChart",(W,compact)=>{
  const task=lbTask;
  const items=M.filter(m=>m.by_task[task].n>0).sort((a,b)=>{const sc=m=>{const t=m.by_task[task];return t.stages.reduce((s,v,i)=>s+v*i,0)/t.n+t.success/t.n*3;};return sc(b)-sc(a);});
  return rows({title:"Furthest stage reached by model",items,W,compact,max:1,ticks:[0,.25,.5,.75,1],tickFmt:v=>Math.round(v*100)+"%",rightHead:"Completed",
    segs:m=>{const t=m.by_task[task];return t.stages.map((v,i)=>({v:v/t.n,c:ST_COL[i],t:`${ST_LAB[i]} ${v} of ${t.n}`}));},
    right:m=>{const t=m.by_task[task];return `<tspan fill="${t.success?PAL.green:C.soft}">${t.success}/${t.n}</tspan>`;}});
});
tabs(document.getElementById("das-lbTabs"),"all",k=>{lbTask=k;const c=CHARTS.find(c=>c.host.id==="das-lbChart");renderChart(c,true);});
</script>
